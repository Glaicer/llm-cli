[package]
name = "llm-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "llm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "6"
rustyline = "18"
thiserror = "2"
